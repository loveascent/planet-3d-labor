<style>
  /* Aufbau: Bild oben, Statuszeile, Bedienung darunter; ab 900 px Bedienung als Spalte rechts. Bewusst nur dunkel (Weltraum). */
  :root { color-scheme: dark; --bg: #0b0d12; --fl: #151923; --ra: #2a3040; --tx: #e8eaf0; --t2: #9aa3b5; --ak: #ffb454; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--tx); font: 14px/1.4 system-ui, sans-serif; }
  #bild { display: block; width: 100%; height: 62vh; touch-action: none; background: #000; }
  #status { padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); color: var(--t2); font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--ra); }
  #bedienung { padding-block: 12px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 760px; margin: 0 auto; display: grid; gap: 10px; }
  .reihe { display: flex; flex-wrap: wrap; gap: 8px; }
  button { flex: 1 1 auto; min-height: 42px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--ra); background: var(--fl); color: var(--tx); font: inherit; }
  button:active { border-color: var(--ak); color: var(--ak); }
  button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--ak); outline-offset: 2px; }
  .regler { display: grid; grid-template-columns: 110px 1fr 56px; gap: 10px; align-items: center; }
  .regler span:last-child { text-align: right; color: var(--t2); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--ak); }
  details { border: 1px solid var(--ra); border-radius: 8px; padding: 8px 12px; background: var(--fl); }
  summary { cursor: pointer; }
  .schalter { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--ra); align-items: flex-start; }
  .schalter small { color: var(--t2); }
  @media (min-width: 900px) { body { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: auto 1fr; } #bild { height: 100%; grid-row: 1 / 3; } #bedienung { overflow: auto; align-content: start; } }
</style>

// src/geraet.js
async function geraetHolen() {
  if (!navigator.gpu) throw new Error("Dieser Browser hat kein WebGPU.");
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
  if (!adapter) throw new Error("Kein WebGPU-Adapter gefunden.");
  const device = await adapter.requestDevice();
  device.addEventListener("uncapturederror", (e) => console.error("GPU-Fehler: " + e.error.message));
  return { device, adapter, format: navigator.gpu.getPreferredCanvasFormat() };
}
var modul = (device, code, name) => {
  const m = device.createShaderModule({ code, label: name });
  m.getCompilationInfo().then((i) => {
    for (const x of i.messages) if (x.type === "error") console.error(`WGSL ${name} Zeile ${x.lineNum}: ${x.message}`);
  });
  return m;
};

// src/bausteine.js
var BAUSTEINE = [

function schalterAusUrl(qs2) {
  const s = Object.fromEntries(BAUSTEINE.map((b) => [b.schluessel, b.an]));
  for (const k of (qs2.get("aus") || "").split(",")) if (k in s) s[k] = false;
  for (const k of (qs2.get("an") || "").split(",")) if (k in s) s[k] = true;
  return s;
}

// src/gemeinsam.js
var NR = 64;
var NZ = 128;
var RD = 2;
var HD = 4;
var H = RD / NR;
var SLOTS = 8;
var SLOT_FELDER = [
  "an",
  "t",
  "dt",
  "neu",
  // wach?, Zeit seit Zündung, Zeitschritt, 1 nur im Zündschritt
  "n2a",
  "n2b",
  "ztp",
  "turb",
  // Schichtung N² unten/oben, Höhe der Sperrschicht, Turbulenzgrad der Marker
  "qR",
  "qH",
  "qB",
  "qAsche",
  // Dauerquelle (Schlot): Radius, Höhe, Auftrieb, Asche
  "qGlut",
  "qAn",
  "strahl",
  "gewicht",
  // Glut der Quelle, Quelle an?, Schubgeschwindigkeit, Aschegewicht
  "sink",
  "kuehl",
  "heben",
  "schwelle",
  // Sinkgeschwindigkeit Asche, Abkühlrate, Staubheben vom Boden, Schwellwind
  "expQ",
  "skala",
  "art",
  "bombenAnteil",
  // Volumenquelle (Feuerball dehnt sich), Planetenradien je Einheit, Ereignisart, Anteil Wurfgeschosse
  "upx",
  "upy",
  "upz",
  "anteil",
  // Ort auf der Kugel (Einheitsvektor), kumulierter Marker-Anteil
  "ejV",
  "g",
  "seed",
  "feuerAnteil",
  // Auswurfgeschwindigkeit am Kraterrand, Fallbeschleunigung, Zufall, Anteil Feuerball-Marker
  "fr",
  "fg",
  "fb",
  "spawn",
  // Rauchfarbe, Nachschubrate toter Marker
  "leben",
  "kraterR",
  "feuerR",
  "feuerZ",
  // Marker-Lebensdauer, Kraterradius, Feuerball-Radius und -Höhe
  "bodenH",
  "wind",
  "res2",
  "res3"
  // Geländehöhe am Ort, Windscherung, Reserve
];
var SLOT_N = SLOT_FELDER.length;
var F = Object.fromEntries(SLOT_FELDER.map((n, i) => [n, i]));
var ART = { VULKAN: 1, BOMBE: 2, EINSCHLAG: 3 };
var WGSL_GEMEINSAM = (
  /* wgsl */
  `
const NR: i32 = ${NR};
const NZ: i32 = ${NZ};
const RD: f32 = ${RD.toFixed(4)};
const HD: f32 = ${HD.toFixed(4)};
const H: f32 = ${H.toFixed(6)};
const SLOTS: u32 = ${SLOTS}u;
const PI: f32 = 3.14159265;
struct Slot { ${SLOT_FELDER.map((n) => `${n}: f32`).join(", ")} }

fn pcg(v: u32) -> u32 {
  let s = v * 747796405u + 2891336453u;
  let w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
  return (w >> 22u) ^ w;
}
fn zuf(seed: ptr<function, u32>) -> f32 { *seed = pcg(*seed); return f32(*seed >> 8u) / 16777216.0; }

// Tangentialbasis am Ereignisort: Spalten = Ost, Nord, Oben
fn basis(up: vec3f) -> mat3x3f {
  let a = select(vec3f(0.0, 1.0, 0.0), vec3f(1.0, 0.0, 0.0), abs(up.y) > 0.9);
  let e1 = normalize(cross(a, up));
  return mat3x3f(e1, cross(up, e1), up);
}
// Ereignis-Koordinaten (x, y = am Boden entlang, z = H\xF6he) auf die Kugel biegen:
// Abstand von der Achse wird Bogenl\xE4nge, H\xF6he wird Radius. Gro\xDFe Wolken legen sich so um den Planeten.
fn lokalZuWelt(p: vec3f, up: vec3f, skala: f32, bodenH: f32) -> vec3f {
  let B = basis(up);
  let rr = length(p.xy);
  let a = rr * skala;
  let d2 = p.xy / max(rr, 1e-6);
  return (1.0 + bodenH + p.z * skala) * (cos(a) * B[2] + sin(a) * (B[0] * d2.x + B[1] * d2.y));
}
// Schwarzk\xF6rper-\xE4hnliche Glutfarbe: dunkelrot -> orange -> gelbwei\xDF
fn glutFarbe(g: f32) -> vec3f {
  let x = clamp(g, 0.0, 4.0);
  return vec3f(1.0, 0.33, 0.07) * x * x * 1.6 + vec3f(0.9, 0.8, 0.5) * max(x - 0.8, 0.0) * 2.0;
}
`
);
function slotSicht(daten, s) {
  const o = s * SLOT_N;
  return new Proxy({}, {
    get: (_, n) => daten[o + F[n]],
    set: (_, n, v) => {
      if (!(n in F)) throw new Error("Slot-Feld unbekannt: " + String(n));
      daten[o + F[n]] = v;
      return true;
    }
  });
}

// src/formeln.js
var sedovQuelle = (A, t) => 4 * Math.PI / 5 * A ** 3 * Math.max(t, 1e-4) ** 0.2;

// src/ereignisse.js
var VORLAGEN = {
  vulkan: {
    art: ART.VULKAN,
    skala: 0.05,
    dauer: 60,
    ausbruch: 40,
    n2a: 0.5,
    n2b: 5,
    ztp: 2.3,
    turb: 0.3,
    qR: 0.16,
    qH: 0.2,
    qB: 3.5,
    qAsche: 1.6,
    qGlut: 1.3,
    strahl: 0.8,
    gewicht: 0.3,
    sink: 0.03,
    kuehl: 1.6,
    heben: 0,
    schwelle: 0,
    bombenAnteil: 0.03,
    ejV: 0.75,
    g: 1.6,
    feuerAnteil: 0,
    spawn: 0.9,
    leben: 30,
    farbe: [0.36, 0.33, 0.31],
    kraterR: 0.6,
    feuerR: 0,
    feuerZ: 0,
    b0: 0,
    tExp: 0,
    rEnd: 0
  },
  bombe: {
    art: ART.BOMBE,
    skala: 0.045,
    dauer: 45,
    ausbruch: 0,
    n2a: 0.5,
    n2b: 5,
    ztp: 2.4,
    turb: 0.3,
    qR: 0,
    qH: 0,
    qB: 0,
    qAsche: 0,
    qGlut: 0,
    strahl: 0,
    gewicht: 0.3,
    sink: 0.02,
    kuehl: 0.45,
    heben: 5,
    schwelle: 0.12,
    bombenAnteil: 0,
    ejV: 0,
    g: 1.6,
    feuerAnteil: 0.6,
    spawn: 25,
    leben: 40,
    farbe: [0.55, 0.5, 0.46],
    kraterR: 0.2,
    feuerR: 0.32,
    feuerZ: 0.3,
    b0: 9,
    tExp: 0.45,
    rEnd: 0.5
  },
  einschlag: {
    art: ART.EINSCHLAG,
    skala: 0.11,
    dauer: 45,
    ausbruch: 0,
    n2a: 0.4,
    n2b: 4,
    ztp: 2.6,
    turb: 0.35,
    qR: 0,
    qH: 0,
    qB: 0,
    qAsche: 0,
    qGlut: 0,
    strahl: 0,
    gewicht: 0.5,
    sink: 0.04,
    kuehl: 0.35,
    heben: 6,
    schwelle: 0.12,
    bombenAnteil: 0.2,
    ejV: 0.9,
    g: 1.4,
    feuerAnteil: 0.45,
    spawn: 25,
    leben: 40,
    farbe: [0.42, 0.36, 0.3],
    kraterR: 0.34,
    feuerR: 0.34,
    feuerZ: 0,
    b0: 10,
    tExp: 0.5,
    rEnd: 0.55
  }
};
function erzeugeEreignisse(device) {
  const daten = new Float32Array(SLOTS * SLOT_N);
  const puffer = device.createBuffer({ size: daten.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const info = new Array(SLOTS).fill(null);
  let traeger = null, boden = null, uhr = 0;
  const anfang = (v) => {
    const z = new Float32Array(NR * NZ * 4);
    if (v.feuerR > 0) for (let j = 0; j < NZ; j++) for (let i = 0; i < NR; i++) {
      const d = Math.hypot((i + 0.5) * H, (j + 0.5) * H - v.feuerZ) / v.feuerR;
      const w = d < 1 ? 1 - d * d * (3 - 2 * d) : 0, o = (j * NR + i) * 4;
      z[o + 1] = v.b0 * w;
      z[o + 2] = 2 * w;
      z[o + 3] = 2.2 * w;
    }
    return z;
  };
  return {
    daten,
    puffer,
    info,
    verbinde(t, b) {
      traeger = t;
      boden = b;
    },
    wach: () => info.filter(Boolean).length,
    hoechster() {
      let h = -1;
      info.forEach((x, s) => {
        if (x) h = s;
      });
      return h;
    },
    // Ereignis zünden. up = Ort auf der Kugel (Einheitsvektor). opt.groesse skaliert das ganze Ereignis.
    starte(name, up, opt = {}) {
      const v = { ...VORLAGEN[name], ...opt };
      let s = info.findIndex((x) => !x);
      if (s < 0) {
        s = 0;
        info.forEach((x, k) => {
          if (x.t > info[s].t) s = k;
        });
        this.schlafen(s);
      }
      const S = slotSicht(daten, s);
      for (const k of [
        "n2a",
        "n2b",
        "ztp",
        "turb",
        "qR",
        "qH",
        "qB",
        "qAsche",
        "qGlut",
        "strahl",
        "gewicht",
        "sink",
        "kuehl",
        "heben",
        "schwelle",
        "bombenAnteil",
        "ejV",
        "g",
        "feuerAnteil",
        "spawn",
        "leben",
        "kraterR",
        "feuerR",
        "feuerZ",
        "art"
      ]) S[k] = v[k];
      S.skala = v.skala * (opt.groesse || 1);
      S.an = 1;
      S.t = 0;
      S.neu = 1;
      S.qAn = v.ausbruch > 0 ? 1 : 0;
      S.expQ = 0;
      S.upx = up[0];
      S.upy = up[1];
      S.upz = up[2];
      S.fr = v.farbe[0];
      S.fg = v.farbe[1];
      S.fb = v.farbe[2];
      S.seed = Math.random() * 100;
      S.wind = opt.wind ?? 0.25;
      S.bodenH = boden ? boden.hoehe(up) : 0;
      info[s] = { name, v, t: 0, slot: s, up };
      traeger?.setzeSlot(s, anfang(v));
      if (boden) {
        const R = S.kraterR * S.skala;
        if (v.art === ART.VULKAN) {
          boden.stempel({ art: 1, zentrum: up, radius: R, rand: 0.2 * R, tiefe: 0.05 * R, hitze: 2.5, russ: 0.35, basis: S.bodenH });
          S.bodenH += 0.2 * R * 0.9;
        } else {
          boden.stempel({ art: 0, zentrum: up, radius: R, rand: 0.07 * R, tiefe: 0.3 * R, hitze: v.art === ART.EINSCHLAG ? 3 : 1.2, russ: 0.8, basis: S.bodenH });
          S.bodenH = Math.max(S.bodenH - 0.3 * R, 0);
        }
      }
      return s;
    },
    schlafen(s) {
      const x = info[s];
      if (!x) return;
      const S = slotSicht(daten, s);
      boden?.stempel({ art: 2, zentrum: x.up, radius: 1.3 * S.skala, rand: 0, tiefe: 0, hitze: 0, russ: 0.5, basis: 0 });
      S.an = 0;
      info[s] = null;
    },
    alleSchlafen() {
      for (let s = 0; s < SLOTS; s++) {
        if (info[s]) {
          slotSicht(daten, s).an = 0;
          info[s] = null;
        }
      }
    },
    // vor jedem Zeitschritt
    schritt(dt) {
      uhr += dt;
      let wach = 0;
      for (const x of info) if (x) wach++;
      let kum = 0;
      for (let s = 0; s < SLOTS; s++) {
        const S = slotSicht(daten, s), x = info[s];
        if (x) {
          x.t += dt;
          S.t = x.t;
          S.dt = dt;
          if (x.v.ausbruch > 0 && x.t > x.v.ausbruch) S.qAn = 0;
          S.expQ = x.v.tExp > 0 && x.t < x.v.tExp ? sedovQuelle(x.v.rEnd / x.v.tExp ** 0.4, x.t) : 0;
          if (x.t > x.v.dauer) {
            this.schlafen(s);
          } else kum += 1 / wach;
        }
        S.anteil = kum;
      }
      device.queue.writeBuffer(puffer, 0, daten);
    },
    nachSchritt() {
      for (let s = 0; s < SLOTS; s++) daten[s * SLOT_N + 3] = 0;
    }
    // 'neu' gilt genau einen Schritt
  };
}

// src/traeger/achse.js
var KOPF = WGSL_GEMEINSAM + /* wgsl */
`
fn ix(i: i32, j: i32, s: u32) -> u32 { return (s * u32(NZ) + u32(clamp(j, 0, NZ - 1))) * u32(NR) + u32(clamp(i, 0, NR - 1)); }
`;
var ADVEKTION = KOPF + /* wgsl */
`
@group(0) @binding(0) var<storage, read> slots: array<Slot>;
@group(0) @binding(1) var<storage, read> zA: array<vec4f>;
@group(0) @binding(2) var<storage, read_write> zB: array<vec4f>;
@group(0) @binding(3) var feld: texture_2d_array<f32>;
@group(0) @binding(4) var samp: sampler;

fn cr(t: f32) -> vec4f { let a = t * t; let b = a * t; return vec4f(-0.5 * b + a - 0.5 * t, 1.5 * b - 2.5 * a + 1.0, -1.5 * b + 2.0 * a + 0.5 * t, 0.5 * b - 0.5 * a); }
// Bikubisch (Catmull-Rom) mit Begrenzer auf die vier n\xE4chsten Zellen: verschmiert viel weniger als bilinear,
// erzeugt aber keine neuen Extremwerte. c in Zellkoordinaten (0 = Mitte der ersten Zelle).
fn lesen(c: vec2f, s: u32) -> vec4f {
  let f = floor(c); let w = c - f; let i = i32(f.x); let j = i32(f.y);
  let wx = cr(w.x); let wy = cr(w.y);
  var summe = vec4f(0.0); var lo = vec4f(1e9); var hi = vec4f(-1e9);
  for (var b = -1; b <= 2; b++) {
    var zeile = vec4f(0.0);
    for (var a = -1; a <= 2; a++) {
      let v = zA[ix(i + a, j + b, s)]; zeile += v * wx[a + 1];
      if (a >= 0 && a <= 1 && b >= 0 && b <= 1) { lo = min(lo, v); hi = max(hi, v); }
    }
    summe += zeile * wy[b + 1];
  }
  return clamp(summe, lo, hi);
}
@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  let s = id.z; let S = slots[s];
  if (S.an < 0.5) { return; }
  let i = i32(id.x); let j = i32(id.y);
  let p = (vec2f(f32(i), f32(j)) + 0.5) * H;
  let u = textureSampleLevel(feld, samp, p / vec2f(RD, HD), s, 0.0).xy;
  // Transport (semi-Lagrange, Stam 1999): woher kam diese Zelle?
  var q = lesen((p - u * S.dt) / H - 0.5, s);
  q.z = lesen((p - (u - vec2f(0.0, S.sink)) * S.dt) / H - 0.5, s).z;      // Asche sinkt zus\xE4tzlich
  // Auftrieb erzeugt Wirbel
  let l = zA[ix(i - 1, j, s)]; let r = zA[ix(i + 1, j, s)];
  q.x -= ((r.y - S.gewicht * r.z) - (l.y - S.gewicht * l.z)) / (2.0 * H * p.x) * S.dt;
  // Schichtung der Umgebungsluft
  let n2 = mix(S.n2a, S.n2b, smoothstep(S.ztp - 0.25, S.ztp + 0.25, p.y));
  q.y -= n2 * u.y * S.dt;
  q.w *= exp(-S.kuehl * S.dt);
  // Staub vom Boden: Bodenwind \xFCber der Schwelle hebt Staub (unterste Zellreihe)
  if (j == 0) { q.z += S.heben * max(abs(u.x) - S.schwelle, 0.0) * S.dt; }
  // Dauerquelle (Schlot) und Schubstrahl (Wirbelschicht am Strahlrand: \u03C9 = W / Randdicke)
  if (S.qAn > 0.5 && p.y < S.qH) {
    let k = clamp(10.0 * S.dt, 0.0, 1.0);
    if (p.x < S.qR) { q.y = mix(q.y, S.qB, k); q.z = mix(q.z, S.qAsche, k); q.w = mix(q.w, S.qGlut, k); }
    if (abs(p.x - S.qR) < H) { q.x = mix(q.x, S.strahl / (2.0 * H * p.x), k); }
  }
  // Schwamm an Au\xDFen- und Oberrand: nichts prallt zur\xFCck
  let sw = clamp((smoothstep(0.82, 1.0, p.x / RD) + smoothstep(0.88, 1.0, p.y / HD)) * 6.0 * S.dt, 0.0, 1.0);
  q.x *= 1.0 - sw; q.y *= 1.0 - sw; q.z *= 1.0 - sw;
