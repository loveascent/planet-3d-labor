<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wasserkugel-Labor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Ein dunkler Laborraum: Bild randlos, Bedienung als Glasblatt unten (Daumenreichweite), Akzent = Bernstein des Tees */
:root{color-scheme:dark;--bg:#07090c;--glass:rgba(16,20,26,.78);--line:rgba(255,255,255,.10);--tx:#eef2f5;--mu:#93a0ad;--ac:#f0a64a;--ac2:#ffd59a;--on:rgba(240,166,74,.18);
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-num:"JetBrains Mono",ui-monospace,Menlo,monospace}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 var(--f-ui);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;gap:6px;align-items:center;font:12px var(--f-num);color:var(--mu);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 10px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#hud b{color:var(--ac2);font-weight:600}
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:460px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:6px max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:900px){#sheet{left:auto;right:16px;bottom:16px;border-radius:20px;border-bottom:1px solid var(--line)}}
#sheet{max-height:min(78dvh,760px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
#sheet.low{max-height:none;overflow:hidden;transform:translateY(calc(100% - 196px - env(safe-area-inset-bottom,0px)))}
.h{font:700 11px var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--mu);margin-top:4px}
.ib{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--mu);font:600 12px var(--f-ui);padding:0;cursor:pointer}
.inf{grid-column:1/-1;font:11.5px/1.45 var(--f-num);color:#cfd8e3;background:rgba(0,0,0,.28);border-radius:8px;padding:6px 8px;margin:-2px 0 4px}
.seg.q{grid-template-columns:repeat(4,1fr)}
#grab{width:64px;height:6px;margin:6px 0 4px}
#grab{align-self:center;width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);border:0;padding:0;margin:4px 0 2px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:600 13px var(--f-ui);color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--on);border-color:var(--ac);color:var(--ac2)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{font:600 12.5px var(--f-ui);color:var(--mu);background:transparent;border:0;border-radius:9px;padding:8px 4px;cursor:pointer;line-height:1.15}
.seg button small{display:block;font-weight:500;font-size:10.5px;opacity:.75}
.seg button.on{background:rgba(255,255,255,.1);color:var(--tx)}
.row{display:flex;gap:8px}
.act{flex:1;font:600 13.5px var(--f-ui);color:#1c1206;background:var(--ac);border:0;border-radius:12px;padding:11px 10px;cursor:pointer}
.act.ghost{flex:0 0 auto;color:var(--tx);background:rgba(255,255,255,.07);border:1px solid var(--line)}
.sl{display:grid;grid-template-columns:92px minmax(0,1fr) 46px 26px;align-items:center;gap:8px}
.sl label{color:var(--mu);font-size:12.5px}
.sl output{font:12px var(--f-num);color:var(--ac2);text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ac) var(--p,50%),rgba(255,255,255,.14) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-9px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.14)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--ac)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0}
select{font:13px var(--f-ui);color:var(--tx);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:8px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mu);font-size:11.5px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center}
#err div{max-width:420px;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:20px}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}

/* Layout ohne schwebendes Blatt: Bild oben, Bedienung darunter im normalen Seitenfluss (jeder Artefakt-Rahmen kann scrollen) */
html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto;touch-action:auto}
#view{position:relative;height:min(60vh,720px);min-height:280px}
#view canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px))}
#sheet,#sheet.low{position:static;transform:none;max-width:none;max-height:none;overflow:visible;margin:0;border-radius:18px 18px 0 0;border-bottom:0;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
#grab{display:none}
@media (min-width:900px){html,body{height:100%;overflow:hidden}#view{position:fixed;inset:0;height:auto}#sheet,#sheet.low{position:fixed;left:auto;right:16px;top:16px;bottom:16px;width:420px;overflow-y:auto;border-radius:18px;border:1px solid var(--line)}}
</style>
</head>
<body>
<div id="view"><canvas id="c"></canvas>
<div id="hud"><span id="fps">–</span><span>·</span><span id="info">–</span></div></div>
<div id="sheet">
  <button id="grab" aria-label="Bedienfeld ein- oder ausklappen"></button>
  <div class="chips" id="scenes"></div>
  <div class="seg" id="meth"></div>
  <div class="row"><button class="act" id="go">Milch eingießen</button><button class="act ghost" id="pause" aria-label="Pause">❚❚</button><button class="act ghost" id="reset">Neu</button></div>
  <div class="h">Qualität</div><div class="seg q" id="qual"></div>
  <div class="h">Regler · ⓘ zeigt Formel</div>
  <div id="sliders" style="display:flex;flex-direction:column;gap:2px"></div>
  <div class="foot"><span>Ziehen dreht · zwei Finger zoomen · nach unten scrollen für alle Regler</span></div>
</div>
<div id="err"><div><b>WebGPU fehlt</b><p style="color:var(--mu)">Dieses Labor rechnet die Strömung auf der Grafikkarte. Bitte in aktuellem Chrome (Android/Desktop) oder Safari 26 öffnen.</p></div></div>
<script type="module">
// Gitter-Strömung (Stam 1999 „Stable Fluids“ in 3D, MacCormack-Farbtransport, Wirbelverstärkung Fedkiw 2001),
// Milch als „umgekehrter Rauch“ (Boussinesq: schwer → sinkt). Darstellung: M2 Volumen-Raymarching mit Lichtvolumen, M3 Marker.
const qs=new URLSearchParams(location.search), TEST=qs.has('test'), $=s=>document.querySelector(s);
const TIERS={potato:{G:56,D:80,nt:300000,rs:.45,jac:24,name:'Altes Handy'},phone:{G:72,D:112,nt:800000,rs:.6,jac:30,name:'Gutes Handy'},laptop:{G:96,D:160,nt:2000000,rs:.8,jac:40,name:'Laptop'},gaming:{G:128,D:224,nt:4000000,rs:1,jac:60,name:'Gaming-PC'}};
let tierKey=qs.get('tier');if(!TIERS[tierKey]){try{tierKey=localStorage.getItem('wkl.tier2')}catch(e){}}if(tierKey==='igpu')tierKey='laptop';if(!TIERS[tierKey])tierKey=/Mobi|Android|iPhone|iPad/.test(navigator.userAgent)?'phone':'laptop';
const T={...TIERS[tierKey]};if(qs.get('rs'))T.rs=+qs.get('rs');
const G=T.G,D=T.D,MAXT=T.nt;let M=+(qs.get('m')||2);if(M!==3)M=2;
if(!navigator.gpu){document.getElementById('err').style.display='grid';throw 0;}
const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});if(!adapter){document.getElementById('err').style.display='grid';throw 0;}
const device=await adapter.requestDevice({requiredLimits:{maxStorageBufferBindingSize:Math.min(adapter.limits.maxStorageBufferBindingSize,268435456),maxBufferSize:Math.min(adapter.limits.maxBufferSize,268435456)}});
const canvas=$('#c'),ctx=canvas.getContext('webgpu'),FMT=navigator.gpu.getPreferredCanvasFormat();
ctx.configure({device,format:FMT,alphaMode:'opaque',usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC});

// ---------- gemeinsame WGSL-Teile
const W_U=/*wgsl*/`
struct U { a: vec4f, b: vec4f, c: vec4f, d: vec4f, e: vec4f, f: vec4f };
// a: G, D, dt, mode(1 Tasse, 0 Kugel)   b: center xyz, Rs (Kugel)   c: Rc, Y0, YT, buoy
// d: jet pos xyz (Kugel: Eintrittspunkt), jetR   e: jet dir xyz, jetV   f: vortEps, srcOn, time, -
@group(0) @binding(0) var<uniform> u: U;
fn inDom(p: vec3f) -> bool {
  if (u.a.w > 0.5) { let q = p.xz - u.b.xz; return dot(q, q) < u.c.x * u.c.x && p.y > u.c.y && p.y < u.c.z; }
  return length(p - u.b.xyz) < u.b.w;
}
fn inJet(p: vec3f) -> bool {
  let d = u.e.xyz; let q = p - u.d.xyz; let t = dot(q, d);
  return t > -0.5 && t < 2.5 && length(q - d * t) < u.d.w;
}
`;
const W_SIM=W_U+/*wgsl*/`
@group(0) @binding(1) var S0: sampler;
@group(0) @binding(2) var VIN: texture_3d<f32>;
@group(0) @binding(3) var VOUT: texture_storage_3d<rgba16float, write>;
@group(0) @binding(4) var CIN: texture_3d<f32>;
fn gs() -> f32 { return u.a.x; }
@compute @workgroup_size(4, 4, 4) fn advV(@builtin(global_invocation_id) id: vec3u) {
  let g = u32(u.a.x); if (any(id >= vec3u(g))) { return; }
  let p = vec3f(id) + 0.5;
  if (!inDom(p)) { textureStore(VOUT, id, vec4f(0.0)); return; }
  let v0 = textureLoad(VIN, id, 0).xyz;
  let back = p - u.a.z * v0;
  var v = textureSampleLevel(VIN, S0, back / gs(), 0.0).xyz;
  // Boussinesq: Milch schwerer → sinkt (Tasse: −y, Kugel: zur Mitte)
  let c = textureSampleLevel(CIN, S0, p / gs(), 0.0).r;
  if (u.a.w > 0.5) { v.y -= u.a.z * u.c.w * c; } else { v -= u.a.z * u.c.w * c * normalize(p - u.b.xyz + vec3f(1e-4)); }
  if (u.f.y > 0.5 && inJet(p)) { v = u.e.xyz * u.e.w; }
  textureStore(VOUT, id, vec4f(v, 0.0));
}
`;
const W_CURL=W_U+/*wgsl*/`
@group(0) @binding(2) var VIN: texture_3d<f32>;
@group(0) @binding(3) var WOUT: texture_storage_3d<rgba16float, write>;
fn V(q: vec3i) -> vec3f { let g = i32(u.a.x); return textureLoad(VIN, clamp(q, vec3i(0), vec3i(g - 1)), 0).xyz; }
@compute @workgroup_size(4, 4, 4) fn curl(@builtin(global_invocation_id) id: vec3u) {
  let g = u32(u.a.x); if (any(id >= vec3u(g))) { return; }
  let c = vec3i(id);
  let dx = (V(c + vec3i(1, 0, 0)) - V(c - vec3i(1, 0, 0))) * 0.5;
  let dy = (V(c + vec3i(0, 1, 0)) - V(c - vec3i(0, 1, 0))) * 0.5;
  let dz = (V(c + vec3i(0, 0, 1)) - V(c - vec3i(0, 0, 1))) * 0.5;
  let w = vec3f(dy.z - dz.y, dz.x - dx.z, dx.y - dy.x);
  textureStore(WOUT, id, vec4f(w, length(w)));
}
`;
const W_CONF=W_U+/*wgsl*/`
@group(0) @binding(2) var VIN: texture_3d<f32>;
@group(0) @binding(3) var VOUT: texture_storage_3d<rgba16float, write>;
@group(0) @binding(4) var WIN: texture_3d<f32>;
fn WL(q: vec3i) -> f32 { let g = i32(u.a.x); return textureLoad(WIN, clamp(q, vec3i(0), vec3i(g - 1)), 0).w; }
@compute @workgroup_size(4, 4, 4) fn conf(@builtin(global_invocation_id) id: vec3u) {
  let g = u32(u.a.x); if (any(id >= vec3u(g))) { return; }
  let c = vec3i(id); var v = textureLoad(VIN, c, 0).xyz;
  let p = vec3f(id) + 0.5;
  if (inDom(p)) {
    let eta = vec3f(WL(c + vec3i(1, 0, 0)) - WL(c - vec3i(1, 0, 0)), WL(c + vec3i(0, 1, 0)) - WL(c - vec3i(0, 1, 0)), WL(c + vec3i(0, 0, 1)) - WL(c - vec3i(0, 0, 1))) * 0.5;
    let el = length(eta);
    if (el > 1e-6) { v += u.a.z * u.f.x * cross(eta / el, textureLoad(WIN, c, 0).xyz); }
  }
  textureStore(VOUT, c, vec4f(v, 0.0));
}
`;
const W_DIV=W_U+/*wgsl*/`
@group(0) @binding(2) var VIN: texture_3d<f32>;
@group(0) @binding(3) var DOUT: texture_storage_3d<r32float, write>;
fn V(q: vec3i) -> vec3f { let g = i32(u.a.x); let qq = clamp(q, vec3i(0), vec3i(g - 1)); if (!inDom(vec3f(qq) + 0.5)) { return vec3f(0.0); } return textureLoad(VIN, qq, 0).xyz; }
@compute @workgroup_size(4, 4, 4) fn div(@builtin(global_invocation_id) id: vec3u) {
  let g = u32(u.a.x); if (any(id >= vec3u(g))) { return; }
  let c = vec3i(id);
  let d = 0.5 * (V(c + vec3i(1, 0, 0)).x - V(c - vec3i(1, 0, 0)).x + V(c + vec3i(0, 1, 0)).y - V(c - vec3i(0, 1, 0)).y + V(c + vec3i(0, 0, 1)).z - V(c - vec3i(0, 0, 1)).z);
  textureStore(DOUT, c, vec4f(d, 0.0, 0.0, 0.0));
}
`;
const W_JAC=W_U+/*wgsl*/`
@group(0) @binding(2) var PIN: texture_3d<f32>;
@group(0) @binding(3) var POUT: texture_storage_3d<r32float, write>;
@group(0) @binding(4) var DIN: texture_3d<f32>;
@compute @workgroup_size(4, 4, 4) fn jac(@builtin(global_invocation_id) id: vec3u) {
  let g = i32(u.a.x); if (any(vec3i(id) >= vec3i(g))) { return; }
  let c = vec3i(id); let pc = textureLoad(PIN, c, 0).r;
  if (!inDom(vec3f(c) + 0.5)) { textureStore(POUT, c, vec4f(0.0)); return; }
  var s = 0.0;
  for (var k = 0; k < 6; k++) { var o = vec3i(0); o[k / 2] = select(-1, 1, (k & 1) == 1);
    let q = clamp(c + o, vec3i(0), vec3i(g - 1));
    s += select(pc, textureLoad(PIN, q, 0).r, inDom(vec3f(q) + 0.5)); }
  textureStore(POUT, c, vec4f((s - textureLoad(DIN, c, 0).r) / 6.0, 0.0, 0.0, 0.0));
}
`;
const W_PROJ=W_U+/*wgsl*/`
@group(0) @binding(2) var VIN: texture_3d<f32>;
@group(0) @binding(3) var VOUT: texture_storage_3d<rgba16float, write>;
@group(0) @binding(4) var PIN: texture_3d<f32>;
@compute @workgroup_size(4, 4, 4) fn proj(@builtin(global_invocation_id) id: vec3u) {
  let g = i32(u.a.x); if (any(vec3i(id) >= vec3i(g))) { return; }
  let c = vec3i(id); let p = vec3f(c) + 0.5;
  if (!inDom(p)) { textureStore(VOUT, c, vec4f(0.0)); return; }
  let pc = textureLoad(PIN, c, 0).r;
  var gp = vec3f(0.0); var v = textureLoad(VIN, c, 0).xyz;
  for (var k = 0; k < 3; k++) {
    var o = vec3i(0); o[k] = 1;
    let qp = clamp(c + o, vec3i(0), vec3i(g - 1)); let qm = clamp(c - o, vec3i(0), vec3i(g - 1));
    let ip = inDom(vec3f(qp) + 0.5); let im = inDom(vec3f(qm) + 0.5);
    gp[k] = 0.5 * (select(pc, textureLoad(PIN, qp, 0).r, ip) - select(pc, textureLoad(PIN, qm, 0).r, im));
    v[k] -= gp[k];
    if (!ip) { v[k] = min(v[k], 0.0); } if (!im) { v[k] = max(v[k], 0.0); }
  }
  textureStore(VOUT, c, vec4f(v, 0.0));
}
`;
// MacCormack-Farbtransport (Selle et al. 2008) auf feinerem Farbgitter D³
const W_DYE=W_U+/*wgsl*/`
@group(0) @binding(1) var S0: sampler;
@group(0) @binding(2) var VEL: texture_3d<f32>;
@group(0) @binding(3) var A: texture_3d<f32>;
@group(0) @binding(4) var B: texture_3d<f32>;
@group(0) @binding(5) var OUT: texture_storage_3d<rgba16float, write>;
@group(0) @binding(6) var<uniform> SGN: vec4f;
fn uvw(id: vec3u) -> vec3f { return (vec3f(id) + 0.5) / u.a.y; }
@compute @workgroup_size(4, 4, 4) fn dstep(@builtin(global_invocation_id) id: vec3u) {
  let d = u32(u.a.y); if (any(id >= vec3u(d))) { return; }
  let q = uvw(id);
  let v = textureSampleLevel(VEL, S0, q, 0.0).xyz;
  let src = q - SGN.x * u.a.z * v / u.a.x;
  textureStore(OUT, id, textureSampleLevel(A, S0, src, 0.0));
}
@compute @workgroup_size(4, 4, 4) fn corr(@builtin(global_invocation_id) id: vec3u) {
  // A = Original, B = Rückwärts-Ergebnis, OUT ← vorwärts + ½(Original − rückwärts), begrenzt
  let d = u32(u.a.y); if (any(id >= vec3u(d))) { return; }
  let q = uvw(id);
  let v = textureSampleLevel(VEL, S0, q, 0.0).xyz;
  let src = q - u.a.z * v / u.a.x;
  let fw = textureSampleLevel(A, S0, src, 0.0);
  var r = fw + 0.5 * (textureLoad(A, id, 0) - textureLoad(B, id, 0));
  // Grenzen der 8 Nachbarn am Herkunftsort (Stabilität)
  let sp = src * u.a.y - 0.5; let i0 = vec3i(floor(sp)); var lo = vec4f(1e9); var hi = vec4f(-1e9);
  for (var k = 0; k < 8; k++) { let o = vec3i(k & 1, (k >> 1) & 1, (k >> 2) & 1); let s = textureLoad(A, clamp(i0 + o, vec3i(0), vec3i(i32(d) - 1)), 0); lo = min(lo, s); hi = max(hi, s); }
  r = clamp(r, lo, hi);
  let p = q * u.a.x;
  if (!inDom(p)) { r = vec4f(0.0); }
  if (u.f.y > 0.5 && inJet(p)) { r = vec4f(1.0, 0.0, 0.0, 0.0); }
  textureStore(OUT, id, r);
}
`;
const TEA='vec3f(0.08, 1.6, 4.0)';
const W_LIGHT=W_U+/*wgsl*/`
@group(0) @binding(1) var S0: sampler;
@group(0) @binding(2) var C: texture_3d<f32>;
@group(0) @binding(3) var LOUT: texture_storage_3d<rgba16float, write>;
@group(0) @binding(4) var<uniform> LP: vec4f; // Lichtrichtung, Milch-Extinktion je Zelle
@group(0) @binding(5) var<uniform> LQ: vec4f; // Tee-Faktor
@compute @workgroup_size(4, 4, 4) fn light(@builtin(global_invocation_id) id: vec3u) {
  let g = u32(u.a.x); if (any(id >= vec3u(g))) { return; }
  var p = vec3f(id) + 0.5; var tau = vec3f(0.0);
  for (var i = 0; i < 40; i++) { p += LP.xyz;
    if (any(p < vec3f(0.0)) || any(p > vec3f(f32(g)))) { break; }
    if (!inDom(p)) { continue; }
    let c = textureSampleLevel(C, S0, p / u.a.x, 0.0).r;
    tau += c * LP.w + (1.0 - c) * LQ.x * LQ.yzw; }
  textureStore(LOUT, id, vec4f(exp(-tau), 1.0));
}
`;
const W_ADV=W_U+/*wgsl*/`
@group(0) @binding(1) var S0: sampler;
@group(0) @binding(2) var VEL: texture_3d<f32>;

const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function lookAt(e,c,up){const z=nrm(sub(e,c)),x=nrm(crs(up,z)),y=crs(z,x);return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1];}
function invRT(m){const r=[m[0],m[4],m[8],0,m[1],m[5],m[9],0,m[2],m[6],m[10],0,0,0,0,1];const t=[m[12],m[13],m[14]];r[12]=-(r[0]*t[0]+r[4]*t[1]+r[8]*t[2]);r[13]=-(r[1]*t[0]+r[5]*t[1]+r[9]*t[2]);r[14]=-(r[2]*t[0]+r[6]*t[1]+r[10]*t[2]);return r;}
function frame(){
  const on=S.src>0&&!S.paused;

  const U=new Float32Array(24);U.set([G,D,S.paused?0:1,S.mode],0);U.set([...C,S.Rs||0],4);U.set([S.Rc||0,S.Y0||0,S.YT||0,S.buoy],8);U.set([...S.jet,S.jR],12);U.set([...S.jdir,S.jV],16);U.set([S.eps,on?1:0,S.time,0],20);
  device.queue.writeBuffer(uBuf,0,U);
  const os=96/G;device.queue.writeBuffer(lpB,0,new Float32Array([S.L[0]*1.2,S.L[1]*1.2,S.L[2]*1.2,2.4*os*1.2*S.milkK]));device.queue.writeBuffer(lqB,0,new Float32Array([(S.mode===1?.05:.03)*os*1.2*(S.teaK||1),S.teaR,S.teaG,S.teaB]));
  device.queue.writeBuffer(ntB,0,new Float32Array([S.NT,0,0,0]));
  const asp=VW/VH,dd=cam.dist*Math.max(1,Math.pow(.8/asp,.9)),sh=0,tg=[cam.tgt[0],cam.tgt[1]-dd*Math.tan(19*Math.PI/180)*sh*2,cam.tgt[2]];
  const cpw=Math.cos(cam.pitch),eye=[tg[0]+Math.sin(cam.yaw)*cpw*dd,tg[1]+Math.sin(cam.pitch)*dd+dd*Math.tan(19*Math.PI/180)*sh*2,tg[2]+Math.cos(cam.yaw)*cpw*dd];
